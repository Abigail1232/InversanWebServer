services:
  db:
    image: mysql:8.0
    container_name: inversan_db
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - inversan_net

  redis:
    image: redis:7-alpine
    container_name: inversan_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inversan_net

  backend:
    build:
      context: ./Web/Backend/
      dockerfile: Dockerfile
    container_name: inversan_backend
    volumes:
      - backend_assets:/app/assets
    restart: unless-stopped
    ports:
      - "3003:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NODE_ENV: ${NODE_ENV:-production}
      JWT_SECRET: ${JWT_SECRET}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      FRONTEND_URL: ${FRONTEND_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      FACE_SERVICE_URL: ${FACE_SERVICE_URL}
      BIOMETRIC_ENABLED: ${BIOMETRIC_ENABLED:-false}
      SELF_BIOMETRIC_ENROLLMENT_ENABLED: ${SELF_BIOMETRIC_ENROLLMENT_ENABLED:-false}
      SFACE_COSINE_THRESHOLD: ${SFACE_COSINE_THRESHOLD:-0.363}
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD}
      BIOMETRIC_ENCRYPTION_KEY: ${BIOMETRIC_ENCRYPTION_KEY}
      LIVENESS_CHALLENGE_TTL_SECONDS: ${LIVENESS_CHALLENGE_TTL_SECONDS:-90}
      BIOMETRIC_MAX_ATTEMPTS: ${BIOMETRIC_MAX_ATTEMPTS:-5}
      JSON_BODY_LIMIT: ${JSON_BODY_LIMIT:-4mb}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - inversan_net

  face-service:
    build:
      context: ./FaceService
    container_name: inversan_face_service
    restart: unless-stopped
    expose:
      - "8000"
    environment:
      YUNET_SCORE_THRESHOLD: ${YUNET_SCORE_THRESHOLD:-0.9}
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - inversan_net

  frontend:
    build:
      context: ./Web/FrontEnd/
      dockerfile: Dockerfile
      args:
        VITE_API_URL: "https://api.grupoinversan.com"
    container_name: inversan_frontend
    restart: unless-stopped
    ports:
      - "5000:5000"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - inversan_net

volumes:
  db_data:
  redis_data:
  backend_assets:

networks:
  inversan_net:
