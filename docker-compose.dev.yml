name: inversan-local

services:
  db:
    image: mysql:8.0
    container_name: inversan_local_db
    restart: unless-stopped
    command:
      - --default-authentication-plugin=mysql_native_password
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --log-bin-trust-function-creators=1
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql
    ports:
      - "3306:3306"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mysqladmin ping -h 127.0.0.1 -p$$MYSQL_ROOT_PASSWORD --silent",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - inversan_net

  redis:
    image: redis:7-alpine
    container_name: inversan_local_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - inversan_net

  backend:
    build:
      context: ./Web/Backend/
      dockerfile: Dockerfile.dev
    container_name: inversan_local_backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./Web/Backend:/app
      - /app/node_modules
    env_file:
      - .env
    environment:
      DATABASE_URL: mysql://${MYSQL_USER}:${MYSQL_PASSWORD}@db:3306/${MYSQL_DATABASE}
      NODE_ENV: development
      PORT: "3000"
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      COOKIE_SECURE: "false"
      COOKIE_DOMAIN: ""
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5000}
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:5000,http://127.0.0.1:5000,http://localhost:5173,http://127.0.0.1:5173}"
      FACE_SERVICE_URL: http://face-service:8000
      BIOMETRIC_ENABLED: ${BIOMETRIC_ENABLED:-true}
      FACE_MATCH_THRESHOLD: ${FACE_MATCH_THRESHOLD:-0.55}
      LIVENESS_CHALLENGE_TTL_SECONDS: ${LIVENESS_CHALLENGE_TTL_SECONDS:-90}
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run dev"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      face-service:
        condition: service_healthy
    networks:
      - inversan_net

  face-service:
    build:
      context: ./FaceService
    container_name: inversan_local_face_service
    expose:
      - "8000"
    restart: unless-stopped
    volumes:
      - face_models:/root/.insightface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/ready')"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - inversan_net

  frontend:
    build:
      context: ./Web/FrontEnd/
      dockerfile: Dockerfile.dev
    container_name: inversan_local_frontend
    ports:
      - "5000:5173"
    volumes:
      - ./Web/FrontEnd:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: "true"
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    command: sh -c "npm install --no-audit --no-fund && npm run dev"
    depends_on:
      - backend
    networks:
      - inversan_net

volumes:
  db_data:
  redis_data:
  face_models:

networks:
  inversan_net:
